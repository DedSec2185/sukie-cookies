<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sukié Cookies — Oversized NYC-style eggless cookies crafted with Belgian Callebaut chocolate & European butter. Baked fresh daily in Mumbai. Order online for delivery." />
    <meta name="keywords" content="NYC style cookies Mumbai, eggless cookies, Belgian chocolate cookies, best cookies Mumbai, luxury cookies delivery, Sukié Cookies" />
    <meta property="og:title" content="Sukié Cookies | NYC Style Cookies — Baked Fresh in Mumbai" />
    <meta property="og:description" content="Oversized, eggless, gooey-centered cookies crafted with Belgian Callebaut chocolate & European butter. Limited drops, baked fresh daily." />
    <meta property="og:image" content="/images/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0C419C" />
    <title>Sukié Cookies | NYC Style Cookies — Baked Fresh in Mumbai</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured in index.html:', e);
        var errBox = document.getElementById('sukie-global-err');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'sukie-global-err';
          errBox.style = 'position:fixed;top:10px;left:10px;right:10px;z-index:9999999;background:#991b1b;color:#fef2f2;padding:16px;border-radius:12px;font-family:monospace;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,0.8);border:2px solid #f87171;';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = '<strong style="font-size:14px;color:#fca5a5;">⚠️ Sukié Script Exception:</strong><br><br>' +
          '<strong>Message:</strong> ' + (e.message || 'Unknown Error') + '<br>' +
          '<strong>File:</strong> ' + (e.filename || '') + ':' + (e.lineno || '') + '<br>' +
          '<pre style="white-space:pre-wrap;background:#450a0a;padding:10px;margin-top:10px;border-radius:6px;max-height:220px;overflow:auto;font-size:11px;">' +
          (e.error ? e.error.stack : 'No stack trace available') +
          '</pre>' +
          '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="margin-top:10px;padding:8px 16px;background:#fef08a;color:#854d0e;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Clear Storage &amp; Refresh</button>';
      });

      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Promise Rejection:', e.reason);
      });
    </script>
  </head>
  <body style="margin:0;padding:0;background-color:#071B42;">
    <div id="root">
      <div style="min-height:100vh;background:linear-gradient(180deg,#092B6B 0%,#0C419C 50%,#061F52 100%);color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;padding:20px;text-align:center;">
        <div style="width:72px;height:72px;border-radius:50%;padding:3px;background:linear-gradient(180deg,#F3E5AB,#C5A059,#8C6D2B);box-shadow:0 10px 25px rgba(0,0,0,0.4);margin-bottom:16px;">
          <img src="/images/logo.png" alt="Sukié Logo" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />
        </div>
        <h1 style="font-size:24px;font-weight:bold;margin:0 0 4px 0;letter-spacing:0.02em;">Sukié Cookies</h1>
        <p style="font-size:11px;font-family:monospace;letter-spacing:0.2em;text-transform:uppercase;color:#F3E5AB;margin:0 0 16px 0;">Mumbai Atelier</p>
        <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,0.1);border:1px solid rgba(197,160,89,0.4);font-size:11px;font-family:monospace;color:#F3E5AB;">
          <span style="width:6px;height:6px;border-radius:50%;background:#34d399;display:inline-block;"></span>
          <span>Preparing Artisanal Experience...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
